name: lint

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          set -euo pipefail
          mapfile -t files < <(find . -name '*.sh' -not -path './.git/*')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts found yet."
            exit 0
          fi
          shellcheck "${files[@]}"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        run: |
          if [ -f docker/Dockerfile ]; then
            docker run --rm -i hadolint/hadolint < docker/Dockerfile
          else
            echo "No Dockerfile yet — skipping."
          fi

  gitignore-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit tracked files against blocklist
        run: |
          set -euo pipefail
          BLOCKED='\.(img|zip|iso|pdf)$|^secrets/|^\.env$|^\.env\.[^/]+$|^docs/superpowers/'
          BAD=$(git ls-files | grep -E "$BLOCKED" | grep -vE '^\.env\.example$' || true)
          if [ -n "$BAD" ]; then
            echo "::error::Blocked patterns are tracked:"
            echo "$BAD"
            exit 1
          fi
          echo "OK — no blocked files tracked."
